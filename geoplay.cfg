#$1000-$2FFF MSX
#$2800-$3FFF GFX
#$4000-$CBFF Code,Heap, Stack
#$CC00-$CFFF Screen Mem for BMP
#$E000-$FFFF BMP

FEATURES {
    STARTADDRESS: default = $4000;
}

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $d000; 
}

MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
	LOADADDR: file = %O, start = $0801 - 2, size = $0002;
    MAIN:     file = %O, define = yes, start = $0801, size = __HIMEM__- $0801;
    BSS:      file = "", start = __ONCE_RUN__, size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
}

SEGMENTS {
ZEROPAGE: load = ZP,       type = zp;
     LOADADDR: load = LOADADDR, type = ro;
     BASICSTUB: load = MAIN, type = ro, start = $0801;
#    EXEHDR:   load = HEADER,   type = ro;
    
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
	MUSIC:    load = MAIN, type = ro, start = $1000;
    TITLEMAP: load = MAIN, type = ro, start = $2000;
#	CHARSET: load = MAIN, type = ro, define   = yes;
#	MAP:      load = MAIN, type = ro, define   = yes;
	ATTRIBUTES: load = MAIN, type = ro, define   = yes;
    INSTRUCTIONS: load = MAIN, type = ro, define   = yes;
 	SUPERMON: load = MAIN, type = ro, start = $3400;
#	SPRITES:  load = MAIN, type = ro, start = $3e00;
	STARTUP:  load = MAIN,     type = ro, start = $4000;
    CODE:     load = MAIN,     type = ro;
#	CHARSET:  load = MAIN, type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
	

}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
